# Tráfego sintético contínuo: alimenta o dashboard, os traces e a taxa de erro do alerta.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels: { app: traffic-generator }
  template:
    metadata:
      labels: { app: traffic-generator }
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          env:
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evaluation-service-secrets
                  key: SERVICE_API_KEY
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                H="Authorization: Bearer $SERVICE_API_KEY"
                curl -s -o /dev/null -m 3 -H "$H" http://auth-service/validate
                curl -s -o /dev/null -m 3 -H "$H" http://flag-service/flags/demo-flag
                curl -s -o /dev/null -m 3 -H "$H" http://targeting-service/rules/demo-flag
                curl -s -o /dev/null -m 6 "http://evaluation-service/evaluate?flag_name=demo-flag&user_id=user-$(date +%s)"
                sleep 1
              done
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 64Mi }
