apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing
  namespace: togglemaster
---
# Menor privilégio: só lê e reinicia Deployments deste namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healing
  namespace: togglemaster
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healing
  namespace: togglemaster
subjects:
  - kind: ServiceAccount
    name: self-healing
    namespace: togglemaster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-healing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing
  namespace: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels: { app: self-healing }
  template:
    metadata:
      labels: { app: self-healing }
    spec:
      serviceAccountName: self-healing
      containers:
        - name: healer
          image: python:3.12-alpine
          command: ["python", "-u", "/app/healer.py"]
          ports:
            - containerPort: 8080
          env:
            - name: COOLDOWN_SECONDS
              value: "300"
            - name: WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef: { name: self-healing-secrets, key: WEBHOOK_TOKEN }
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef: { name: self-healing-secrets, key: DISCORD_WEBHOOK_URL }
          volumeMounts:
            - name: script
              mountPath: /app
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: script
          configMap:
            name: self-healing-script
---
apiVersion: v1
kind: Service
metadata:
  name: self-healing
  namespace: togglemaster
spec:
  selector: { app: self-healing }
  ports:
    - port: 80
      targetPort: 8080
