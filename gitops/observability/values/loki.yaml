# Loki em binário único com armazenamento local: suficiente para o laboratório.
fullnameOverride: loki
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  storage: { type: filesystem }
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: loki_index_, period: 24h }
  limits_config:
    allow_structured_metadata: true # necessário para o endpoint OTLP
    volume_enabled: true
    retention_period: 72h
singleBinary:
  replicas: 1
  persistence: { enabled: false }
  extraVolumes:
    - name: data
      emptyDir: {}
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
