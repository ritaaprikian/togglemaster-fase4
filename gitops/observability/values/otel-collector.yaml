# OTel Collector: peça central que recebe, processa e roteia toda a telemetria.
#   traces  -> New Relic (APM, Service Map)
#   métricas -> Prometheus (remote write)
#   logs dos contêineres -> Loki (endpoint OTLP)
fullnameOverride: otel-collector
mode: daemonset # um por node: o filelog precisa ler os logs locais de cada node
image:
  repository: otel/opentelemetry-collector-contrib
service:
  enabled: true # expõe o OTLP aos microsserviços também no modo daemonset
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true
extraEnvs:
  - name: NEW_RELIC_LICENSE_KEY
    valueFrom:
      secretKeyRef:
        name: otel-secrets
        key: NEW_RELIC_LICENSE_KEY
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }
config:
  receivers:
    otlp:
      protocols:
        http: { endpoint: "0.0.0.0:4318" }
        grpc: { endpoint: "0.0.0.0:4317" }
  processors:
    batch: { timeout: 5s }
    memory_limiter: { check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 25 }
  exporters:
    otlphttp/newrelic:
      endpoint: https://otlp.nr-data.net
      headers:
        api-key: ${env:NEW_RELIC_LICENSE_KEY}
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
    prometheusremotewrite:
      endpoint: http://kps-prometheus.observability.svc.cluster.local:9090/api/v1/write
      resource_to_telemetry_conversion: { enabled: true } # service_name vira label
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/newrelic]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki]
